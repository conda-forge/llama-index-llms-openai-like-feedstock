schema_version: 1

context:
  version: 0.8.1

package:
  name: llama-index-llms-openai-like
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-openai-like/llama_index_llms_openai_like-${{ version }}.tar.gz
  sha256: 1b6f973bba97cb4ce6c71feb54c2fa6834a071ec1c4b26636dc603b818d07b0b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - llama-index-llms-openai >=0.8.0,<0.9
    - llama-index-core >=0.14.3,<0.15
tests:
  - python:
      imports:
        - llama_index.llms.openai_like
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: llama-index llms openai like integration
  license: MIT
  license_file: LICENSE
  homepage: https://www.llamaindex.ai/
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/llms/llama-index-llms-openai-like/

extra:
  recipe-maintainers:
    - JaRoSchm
