schema_version: 1

context:
  version: 0.9.0

package:
  name: llama-index-llms-openai-like
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/llama-index-llms-openai-like/llama_index_llms_openai_like-${{ version }}.tar.gz
  sha256: ea0437f81da9f242e054aa2e3529f585dc06b44446139d6f4f790f6c1d7a2d47

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - llama-index-llms-openai >=0.8.0,<0.10
    - llama-index-core >=0.14.3,<0.15
tests:
  - python:
      imports:
        - llama_index.llms.openai_like
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: llama-index llms openai like integration
  license: MIT
  license_file: LICENSE
  homepage: https://www.llamaindex.ai/
  repository: https://github.com/run-llama/llama_index/tree/main/llama-index-integrations/llms/llama-index-llms-openai-like/

extra:
  recipe-maintainers:
    - JaRoSchm
